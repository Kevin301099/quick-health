<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طلب تأشيرة سياحية — نسخة اختبار</title>
<style>
  body { font: 15px Tahoma, sans-serif; background: #f4f6f8; margin: 0; }
  .card { max-width: 720px; margin: 24px auto; background: #fff; border-radius: 10px; padding: 22px; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
</style>
</head>
<body>
<div class="card">
  <h2>بيانات مقدم الطلب</h2>
  <div class="g">
    <div><label for="a1">الاسم الأول</label><input id="a1" name="FirstName"></div>
    <div><label for="a2">اسم العائلة</label><input id="a2" name="LastName"></div>
    <div><label for="a3">رقم جواز السفر</label><input id="a3" name="PassportNo"></div>
    <div><label for="a4">تاريخ الميلاد</label><input id="a4" name="BirthDate" placeholder="DD-MM-YYYY"></div>
    <div><label for="a5">الجنسية</label><select id="a5" name="Nationality"><option value="">اختر</option><option value="5">باكستان</option><option value="7">الهند</option><option value="9">بنغلاديش</option></select></div>
    <div><label for="a6">الجنس</label><select id="a6" name="Gender"><option value="">اختر</option><option value="1">ذكر</option><option value="2">أنثى</option></select></div>
    <div><label for="a7">تاريخ انتهاء الجواز</label><input id="a7" name="PassportExpiry" placeholder="DD-MM-YYYY"></div>
    <div><label for="a8">البريد الإلكتروني</label><input id="a8" name="Email"></div>
    <div><label for="a9">رقم الهاتف المتحرك</label><input id="a9" name="Mobile"></div>
    <div><label for="a10">كلمة المرور</label><input id="a10" name="Pwd" type="text"></div>
  </div>
</div>
</body>
</html>
